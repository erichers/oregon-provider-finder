<div class="shell" [class.map-app]="mapFirst()">
  <div class="mast">
    <header class="top">
      <h1><a class="wordmark" routerLink="/"><span class="wordmark-full">Oregon Provider Finder</span><span class="wordmark-short" aria-hidden="true">OR Provider Finder</span></a></h1>
      <nav class="nav" aria-label="Directory">
        <a routerLink="/">Search</a>
        <a routerLink="/about-data">About the data</a>
        <a href="https://github.com/erichers/oregon-provider-finder">GitHub</a>
      </nav>
    </header>
    <p class="crisis">
      <span class="crisis-long">In crisis? <a href="tel:988">Call 988</a> or <a href="sms:988">text 988</a></span>
      <span class="crisis-short">Crisis? <a href="tel:988" aria-label="Call 988">Call</a> or <a href="sms:988" aria-label="Text 988">text</a> 988</span>
    </p>
    <button type="button" class="nav-more" [attr.aria-expanded]="menuOpen()" aria-controls="directory-menu" aria-label="Menu" (click)="menuOpen.update((open) => !open)">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
      </svg>
    </button>
    <nav id="directory-menu" class="nav-menu" aria-label="Directory menu" [hidden]="!menuOpen()">
      <a routerLink="/" (click)="menuOpen.set(false)">Search</a>
      <a routerLink="/about-data" (click)="menuOpen.set(false)">About the data</a>
      <a href="https://github.com/erichers/oregon-provider-finder" (click)="menuOpen.set(false)">GitHub</a>
    </nav>
  </div>
  <main id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>
